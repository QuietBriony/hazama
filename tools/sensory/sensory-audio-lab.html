<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04060b">
  <title>Hazama Sensory Response Lab</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #04060b; color: #d8e3e8; }
    * { box-sizing: border-box; }
    html { background: #04060b; }
    body {
      max-width: 880px;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
        max(72px, calc(env(safe-area-inset-bottom) + 56px)) max(18px, env(safe-area-inset-left));
      overflow-wrap: anywhere;
    }
    h1 { margin-bottom: 12px; font-size: clamp(1.45rem, 7vw, 2.3rem); letter-spacing: .045em; line-height: 1.25; }
    h2 { margin: 0; font-size: clamp(1.08rem, 4.8vw, 1.35rem); }
    p { margin: 0; line-height: 1.65; color: #aebfc6; }
    .notice { border-left: 3px solid #7fb6c4; padding: 10px 12px; background: #0b121a; }
    .panel { display: grid; gap: 16px; margin-top: 18px; padding: 18px; border: 1px solid #263943; border-radius: 12px; background: #071018; }
    .step { color: #7fb6c4; font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .scene-button { display: grid; place-content: center; gap: 3px; min-height: 64px; padding: 8px; }
    .scene-button small { color: #a9bac1; font-size: .8rem; }
    .scene-button[aria-pressed="true"] { border-color: #b7dce3; background: #17313b; box-shadow: 0 0 0 1px #6d9eaa inset; }
    #scene-summary { min-height: 1.65em; color: #bdd5db; }
    .row { display: grid; grid-template-columns: minmax(110px, .55fr) minmax(180px, 1fr) 4rem; gap: 12px; align-items: center; }
    label { font-weight: 650; }
    output { font-variant-numeric: tabular-nums; text-align: right; }
    select, button, input { font: inherit; }
    input[type="range"] { width: 100%; min-height: 44px; accent-color: #7fb6c4; }
    select, button { min-height: 48px; border: 1px solid #49636e; border-radius: 8px; color: inherit; background: #101d25; }
    select { width: 100%; padding: 8px 10px; }
    button { cursor: pointer; padding: 10px 14px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:hover, button:focus-visible { border-color: #9bc8d3; background: #172b35; }
    .verbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }
    .audio-dock { position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 2; display: grid; gap: 8px; padding: 10px; border: 1px solid #354e59; border-radius: 10px; background: rgb(5 13 20 / 94%); box-shadow: 0 12px 30px #0009; backdrop-filter: blur(10px); }
    #audio-toggle { width: 100%; border-color: #b76b5b; font-weight: 750; }
    #status { min-height: 1.5em; color: #9bc8d3; font-size: .92rem; }
    summary { cursor: pointer; min-height: 48px; font-weight: 750; line-height: 48px; touch-action: manipulation; }
    details.panel[open] > summary { border-bottom: 1px solid #263943; }
    pre { max-height: 360px; overflow: auto; padding: 14px; background: #020408; border: 1px solid #18272e; font-size: .78rem; }
    @media (max-width: 580px) {
      body { padding-top: max(16px, env(safe-area-inset-top)); }
      .panel { padding: 14px; }
      .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .scene-button { min-height: 68px; }
      .row { grid-template-columns: 1fr 4rem; gap: 6px 10px; }
      .row label { grid-column: 1 / -1; }
      .verbs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .verbs button { min-height: 54px; padding: 8px; }
      pre { max-height: 50vh; margin: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <h1>Hazama Sensory Response Lab</h1>
    <p class="notice"><strong>candidate / 本編未配線。</strong> 外部音源、Tone.js、保存、通信を使わない試聴面です。音量を下げてから開始してください。</p>

    <section class="panel" aria-labelledby="scene-heading">
      <span class="step">Step 1</span>
      <h2 id="scene-heading">場面を選ぶ</h2>
      <p>まず4場面だけを比べます。選択しただけでは音は始まりません。</p>
      <div class="scenes" role="group" aria-label="レビュー場面">
        <button class="scene-button" type="button" data-scene="shallow" aria-pressed="true"><strong>浅部</strong><small>入口の静けさ</small></button>
        <button class="scene-button" type="button" data-scene="deep" aria-pressed="false"><strong>深部</strong><small>圧と多声</small></button>
        <button class="scene-button" type="button" data-scene="surfaced" aria-pressed="false"><strong>浮上</strong><small>戻った呼吸</small></button>
        <button class="scene-button" type="button" data-scene="omega" aria-pressed="false"><strong>Ω</strong><small>終端の縁</small></button>
      </div>
      <p id="scene-summary" aria-live="polite">浅部 — 入口の余白と低い気配</p>
    </section>

    <section class="panel" aria-labelledby="verb-heading">
      <span class="step">Step 2</span>
      <h2 id="verb-heading">音を始めて、動詞を聴く</h2>
      <p>端末音量を小さくして開始し、気になる動詞だけ押してください。</p>
      <div class="audio-dock">
        <button id="audio-toggle" type="button" aria-pressed="false" aria-describedby="status">試聴を始める</button>
        <div id="status" role="status" aria-live="polite">停止中</div>
      </div>
      <div class="verbs">
        <button type="button" data-verb="enter">沈み始める</button>
        <button type="button" data-verb="descend">降下する</button>
        <button type="button" data-verb="resist">抗う</button>
        <button type="button" data-verb="recognition">認識が灯る</button>
        <button type="button" data-verb="breath">縁の呼気</button>
        <button type="button" data-verb="forget">忘れる</button>
      </div>
    </section>

    <details class="panel" aria-labelledby="signal-heading">
      <summary id="signal-heading">詳細調整（任意）</summary>
      <div class="row"><label for="depth">深度 depth</label><input id="depth" type="range" min="0" max="1" step="0.01" value="0.18"><output for="depth">0.18</output></div>
      <div class="row"><label for="dread">圧 dread</label><input id="dread" type="range" min="0" max="1" step="0.01" value="0.12"><output for="dread">0.12</output></div>
      <div class="row"><label for="density">多声 density</label><input id="density" type="range" min="0" max="1" step="0.01" value="0.10"><output for="density">0.10</output></div>
      <div class="row"><label for="axis">降り方 axis</label><select id="axis"><option value="deep">構造</option><option value="soma">身体</option><option value="reso">流れ</option><option value="casc">崩壊</option><option value="other">並行</option></select><output></output></div>
      <div class="row"><label for="phase">局面 phase</label><select id="phase"><option value="">depthから自動</option><option value="surface" selected>surface</option><option value="drift">drift</option><option value="deep">deep</option><option value="bottom">bottom</option><option value="surfaced">surfaced</option><option value="omega">omega</option></select><output></output></div>
      <div class="row"><label for="tier">負荷 tier</label><select id="tier"><option value="balanced">balanced</option><option value="full">full</option><option value="light">light</option><option value="static">static</option></select><output></output></div>
    </details>

    <details class="panel" aria-labelledby="trace-heading">
      <summary id="trace-heading">Sensory Frame trace（検証用）</summary>
      <pre id="trace"></pre>
    </details>
  </main>
  <script type="module" src="./sensory-audio-lab.mjs"></script>
</body>
</html>
