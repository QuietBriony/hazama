<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Hazama 狭間</title>
  <meta name="description" content="沈むほど戻りにくい。認識が合う者だけがΩへ潜る、没入の降下対話。" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04060b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hazama" />
  <!-- E4→E30: リンク共有プレビュー（OG/Twitter）。og:image は絶対URL必須＝本番 Pages を指す。
       画像は三段: JPG(og-card) → hero webp → png(icon-512)。詳細は下の E30 コメント。 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hazama 狭間" />
  <meta property="og:description" content="沈むほど戻りにくい。認識が合う者だけがΩへ潜る、没入の降下対話。" />
  <meta property="og:url" content="https://quietbriony.github.io/hazama/" />
  <!-- E30: 先頭は 1200×630 JPG（og-card・width/height 宣言）＝webp を読まない WhatsApp/旧クライアントでも
       欠落しない。二枚目に hero webp、最後に png（icon-512）。LP と同じ og-card を共有（中身は E29 hero 由来）。 -->
  <meta property="og:image" content="https://quietbriony.github.io/hazama/assets/og-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="奈落の縁に立つフードの人影と、遠くの小さなランタンの灯" />
  <meta property="og:image" content="https://quietbriony.github.io/hazama/assets/hazama-descent-key.webp" />
  <meta property="og:image" content="https://quietbriony.github.io/hazama/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://quietbriony.github.io/hazama/assets/og-card.jpg" />
  <meta name="twitter:image:alt" content="奈落の縁に立つフードの人影と、遠くの小さなランタンの灯" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="slice.css?v=e36" />
</head>
<body data-phase="surface">
  <div class="hz-bg" aria-hidden="true">
    <img class="hz-bg-descent" src="assets/hazama-descent-key.webp" alt="" decoding="async" fetchpriority="high" />
    <!-- E29 降下の弧：base(surface) の上に深度/終端の写真層を重ね、既存 data-phase / body.surfaced|omega に
         opacity クロスフェード＝世界が「降りるほど溶け・縁で浮上/Ωに割れる」を1枚でなく段で描く。
         base が常に見える＝JS無効/reduced/初回ペイントで従来と同一（後方互換）。 -->
    <img class="hz-stage" data-stage="drift"    src="assets/hazama-descent-drift.webp"    alt="" aria-hidden="true" decoding="async" fetchpriority="low" />
    <img class="hz-stage" data-stage="bottom"   src="assets/hazama-descent-bottom.webp"   alt="" aria-hidden="true" decoding="async" fetchpriority="low" />
    <img class="hz-stage" data-stage="surfaced" src="assets/hazama-descent-surfaced.webp" alt="" aria-hidden="true" decoding="async" fetchpriority="low" />
    <img class="hz-stage" data-stage="omega"    src="assets/hazama-descent-omega.webp"    alt="" aria-hidden="true" decoding="async" fetchpriority="low" />
    <!-- 反転重森ガーデン（R6）：深く潜るほど"世界の輪郭が溶け"、サイバーパンク×重森三玲の
         枯山水（砂紋/石組/市松苔）が色相反転（自然色を180°反転＝不気味）して progressive に露出する。
         構図は分岐エンジンの信号（周回/到達深度/弾かれ履歴/ランク）= worldSeed で再生成。
         浅はクリーン（opacity 0）。state 変化時のみ再描画＝モバイル軽量。reduced は静止1枚。 -->
    <canvas class="hz-bg-garden" id="garden" aria-hidden="true"></canvas>
    <!-- 沈降グロー：底中央から立ち上る冷たい淵。沈むほど増光・上昇し、曼荼羅が光の底から現れる。 -->
    <div class="hz-bg-abyss"></div>
    <!-- 配線グリッド：沈むほど露出する縦の導線（「世界は塗装だった／編み目」の視覚化）。下方ほど密。 -->
    <div class="hz-bg-grid"></div>
    <div class="hz-bg-mandala"><canvas id="mandala" aria-hidden="true"></canvas></div>
    <!-- 原色 leak（R6）：ティファニーブルー／ラスタ（赤・金・緑）が隙間（あわい）から"ちらちら"漏れる。
         常時は出さず、グリッジのバーストに同調して一瞬だけ明滅＝抑えるほど効く。深いほど明るく漏れる。 -->
    <div class="hz-bg-leak" aria-hidden="true"></div>
    <!-- グリッジ：深度連動の走査線の裂け＋RGBずれ＋データモッシュ。「描画の乱れ」＝塗装が剥がれる。
         既定は不可視（visibility:hidden）。JS が深いほど高頻度・高強度の短いバーストで点灯。 -->
    <div class="hz-glitch" aria-hidden="true"></div>
    <div class="hz-vignette"></div>
    <div class="hz-scanline"></div>
    <div class="hz-grain"></div>
  </div>

  <!-- 塗装剥がれ／めくれ遷移：ノード遷移で一度だけ、ぎざついた縁の帯がめくれて降りる（reduced で無効）。 -->
  <div class="hz-peel" aria-hidden="true"></div>

  <main id="app" class="hz-app">
    <!-- 沈下インジケータ：数値は出さない。線が下へ伸び、戻り道が一本ずつ消え、観測者が増える。 -->
    <div class="hz-gauge" aria-hidden="true">
      <div class="hz-observer" id="observer-count" data-count="1">私</div>
      <div class="hz-gauge-track"><div id="sink-fill" class="hz-gauge-fill"></div></div>
      <div id="return-paths" class="hz-return-paths"></div>
      <div id="attune" class="hz-attune" hidden></div>
    </div>
    <div id="a11y-state" class="hz-sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <section id="scene" class="hz-scene" aria-live="polite"></section>
    <section id="choices" class="hz-choices"></section>
  </main>

  <footer class="hz-footer">
    <button id="audio-toggle" class="hz-chip" type="button" hidden>♪ 鳴らす</button>
    <span id="status" class="hz-status"></span>
  </footer>

  <div id="gate" class="hz-gate" aria-busy="true">
    <div class="hz-gate-inner">
      <h1 class="hz-sr-only">Hazama 狭間</h1>
      <div class="hz-gate-title" aria-hidden="true" data-text="Hazama">Hazama</div>

      <p class="hz-gate-sub">狭間（あわい）<br>沈むほど、戻り道は細くなる。</p>
      <button id="gate-enter" class="hz-gate-enter" type="button" aria-describedby="gate-note" disabled><span>沈む</span></button>
      <p id="gate-note" class="hz-gate-note" role="status" aria-live="polite">深度を読み込み中…</p>
    </div>
  </div>

  <script>
    // E35: 既存SWはversion queryを無視して旧CSS/runtimeを返し得るため、
    // controller takeover後は入口のまま一度reloadし、CSS/JSを同じ版で読む。fresh/current loadは待たせない。
    (() => {
      const SW_URL = "sw.js?v=e36";
      const RUNTIME_URL = "slice.js?v=e36";
      const expectedController = new URL(SW_URL, document.baseURI).href;
      const gate = document.getElementById("gate");
      const gateButton = document.getElementById("gate-enter");
      const gateNote = document.getElementById("gate-note");
      let runtimeStarted = false;
      let retryArmed = false;

      const armRetry = (message) => {
        if (gateNote) {
          gateNote.textContent = message;
          gateNote.classList.add("is-error");
        }
        if (gate) gate.setAttribute("aria-busy", "false");
        if (!gateButton) return;
        const label = gateButton.querySelector("span");
        if (label) label.textContent = "再試行";
        gateButton.disabled = false;
        if (retryArmed) return;
        retryArmed = true;
        gateButton.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          window.location.reload();
        }, { once: true, capture: true });
      };
      window.__hazamaArmRetry = armRetry;
      const failBoot = armRetry;
      const startRuntime = () => {
        if (runtimeStarted) return;
        runtimeStarted = true;
        const script = document.createElement("script");
        script.src = RUNTIME_URL;
        script.onerror = () => failBoot("起動データを読み込めません。再試行してください。");
        document.body.appendChild(script);
      };

      if (!("serviceWorker" in navigator) || !navigator.serviceWorker.controller) {
        startRuntime();
        return;
      }
      if (navigator.serviceWorker.controller.scriptURL === expectedController) {
        startRuntime();
        return;
      }

      if (gateNote) gateNote.textContent = "更新を確認中…";
      let settled = false;
      const finish = (callback) => {
        if (settled) return;
        settled = true;
        window.clearTimeout(timeoutId);
        navigator.serviceWorker.removeEventListener("controllerchange", onControllerChange);
        callback();
      };
      const onControllerChange = () => {
        const controller = navigator.serviceWorker.controller;
        if (controller && controller.scriptURL === expectedController) {
          finish(() => window.location.reload());
        }
      };
      const timeoutId = window.setTimeout(() => {
        finish(() => failBoot("更新を適用できません。通信を確認して再試行してください。"));
      }, 10000);
      navigator.serviceWorker.addEventListener("controllerchange", onControllerChange);
      navigator.serviceWorker.register(SW_URL, { scope: "./", updateViaCache: "none" })
        .then(onControllerChange)
        .catch(() => finish(() => failBoot("更新を適用できません。通信を確認して再試行してください。")));
    })();
  </script>
</body>
</html>
