<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d11">
  <meta name="description" content="Hazamaの独立した視覚試作。夜の駅の同じ窓を、選び直して見る短い体験です。">
  <link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="station-window-lab.css">
  <script src="station-window-lab.js" defer></script>
  <title>HAZAMA — 間の駅 / 視覚試作</title>
</head>
<body>
  <div class="experience" id="experience" data-scene="arrival" data-motion="off">
    <div class="world" aria-hidden="true">
      <div class="station"></div>
      <div class="rain"></div>
      <div class="far-figure figure"></div>
      <div class="near-figure figure"></div>
      <div class="seam"></div>
      <div class="window-frame">
        <div class="glass-reflection"></div>
      </div>
      <div class="glitch glitch-a"></div>
      <div class="glitch glitch-b"></div>
      <div class="world-shade"></div>
    </div>

    <header class="topbar">
      <span class="mark">HAZAMA <span class="mark-divider">/</span> VISUAL STUDY 02</span>
      <button class="motion-toggle" id="motion-toggle" type="button">動きを止める</button>
    </header>

    <main class="story-wrap">
      <section class="story" aria-labelledby="scene-title">
        <p class="eyebrow" id="scene-kicker">01 / 初めての窓</p>
        <h1 id="scene-title" tabindex="-1">間の駅</h1>
        <p class="story-line" id="scene-line" aria-live="polite">終電の記録だけが残る駅。扉のガラスに、雨の線が二重に落ちている。待合室には誰もいない。</p>
        <div class="choices" id="choices" aria-label="この場面で選ぶこと">
          <button type="button" data-next="observed">窓の奥を確かめる<span>見えた線を、覚える</span></button>
          <button type="button" data-next="averted">視線を外す<span>見なかったものを、残す</span></button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>独立試作 · 本編の進行や記憶には接続しない</span>
      <a href="../../">本編へ戻る ↗</a>
    </footer>
  </div>
</body>
</html>
